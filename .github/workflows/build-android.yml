name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Cordova
        run: npm install
      - name: Add Android platform
        run: npx cordova platform add android@14.0.1 --no-interactive
      - name: Add native Android printing plugin
        run: npx cordova plugin add ./plugins/cordova-plugin-nativeprint --no-interactive
      - name: Build debug APK
        run: npx cordova build android --debug --no-interactive
      - name: Rename APK
        run: cp platforms/android/app/build/outputs/apk/debug/app-debug.apk Tasyir-Alikhtibarat.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasyir-Alikhtibarat-Android
          path: Tasyir-Alikhtibarat.apk
          if-no-files-found: error
